name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Engine and recipe checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Without ANDROID_HOME the build includes only the pure Kotlin modules.
      - run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :core:recipes:test :core:engine:test

  android:
    name: Android app and privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - run: tools/check-privacy.sh app/build/outputs/apk/debug/app-debug.apk
